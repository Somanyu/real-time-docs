services:
  - type: web
    name: real-time-docs-ws
    runtime: node
    buildCommand: npm install
    startCommand: npm run ws:start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        sync: false
